# FINAL: the slim per-repo replacement for .github/workflows/ci.yml
# Drop this into each npm repo. It does nothing but delegate to the shared definition.
# Pinned to a commit SHA (not @master) so a change to the shared reusable workflow
# only reaches this repo when the SHA is bumped deliberately. See the uses: line below.
name: CI

on:
  push:
    branches: [master]          # use [main] for repos whose default branch is main
  pull_request:
    branches: [master]

jobs:
  ci:
    uses: XChain-Platform/.github/.github/workflows/ci-reusable.yml@aae44352361242d334234593c39d88be007d2ed3 # pin: XChain-Platform/.github @ master 2026-07-08; bump deliberately 
    # Override the Node version for a repo if ever needed:
    # with:
    #   node-version: "20"

  # The integration tier runs the real indexer against a throwaway MariaDB and
  # asserts ledger state block-by-block. It lives outside the shared reusable
  # workflow because it needs a DB service container and the canonical decoder
  # schema (test/integration/setup/db-connection.js loads xchain-decoder's
  # src/sql/*.sql so the harness can never drift from the real decoder schema).
  # No xchain-vm is provisioned here (the dir is gitignored); the indexer
  # degrades gracefully and the whole tier is written to pass without a VM
  # (EXECUTE paths are e2e-suite territory).
  integration:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Throwaway fixture credential for the ephemeral CI container only.
          MARIADB_ROOT_PASSWORD: xchain-fixture-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      # xchain-decoder is still PRIVATE pre-launch, so the default GITHUB_TOKEN
      # cannot read it, so this uses a read-only deploy key scoped to that one
      # repo (secret XCHAIN_DECODER_DEPLOY_KEY). When the repos flip public at
      # launch, the ssh-key line can simply be dropped.
      - name: Check out the canonical decoder schema
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-decoder
          ssh-key: ${{ secrets.XCHAIN_DECODER_DEPLOY_KEY }}
          path: .xchain-decoder

      # Scenario 15 (SDK<->indexer fee-fragment parity drift guard) needs the
      # real sdk source. Same private-repo deploy-key pattern as the decoder
      # above (secret XCHAIN_SDK_DEPLOY_KEY, read-only, scoped to xchain-sdk).
      - name: Check out the sdk for the parity scenario
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-sdk
          ssh-key: ${{ secrets.XCHAIN_SDK_DEPLOY_KEY }}
          path: .xchain-sdk

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run the integration tier
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASS: xchain-fixture-throwaway
          XCHAIN_DECODER_SQL_PATH: ${{ github.workspace }}/.xchain-decoder/src/sql
          XCHAIN_SDK_PATH: ${{ github.workspace }}/.xchain-sdk
        run: npm run test:integration:ci

  # Perf regression gate : the scaling/throughput perf scenarios each
  # reset the DB between measurement points, so every sample runs on a young,
  # nearly-empty database and none can see the dominant scale risk here -- the
  # per-block sweeps (getExpiredItems, cross-chain settlement, cooldown) re-scan a
  # growth-unbounded standing set every block. Scenario 07 does NOT reset: it
  # measures block time young, grows the standing set, measures again grown, and
  # asserts a block-time regression metric (grown median / young median <= ceiling).
  # It shares the integration job's throwaway-MariaDB + canonical-decoder-schema
  # setup. The ceiling is a RATIO within one run, so it is robust to runner speed.
  perf-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:11.4
        env:
          # Throwaway fixture credential for the ephemeral CI container only.
          MARIADB_ROOT_PASSWORD: xchain-fixture-throwaway
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4

      # xchain-decoder is still PRIVATE pre-launch, so this uses a read-only deploy
      # key scoped to that one repo (secret XCHAIN_DECODER_DEPLOY_KEY), same as the
      # integration job. Drop the ssh-key line when the repos flip public at launch.
      - name: Check out the canonical decoder schema
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-decoder
          ssh-key: ${{ secrets.XCHAIN_DECODER_DEPLOY_KEY }}
          path: .xchain-decoder

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Run the grown-database perf regression scenario
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: "3306"
          TEST_DB_USER: root
          TEST_DB_PASS: xchain-fixture-throwaway
          XCHAIN_DECODER_SQL_PATH: ${{ github.workspace }}/.xchain-decoder/src/sql
        run: npm run test:perf:grown

  # Cross-repo drift guards (SD-1 / ): this repo vendors the canonical
  # coin registry from xchain-hub, and per-repo CI cannot see sibling repos, so
  # a drifted vendored copy previously shipped green (the byte-identity checks
  # ran only in the monorepo's manual bin/ci-all.sh). This job recreates the
  # sibling layout (self + canonical side by side) and runs the same checks.
  # The canonical repo is private pre-launch, so its checkout uses a read-only
  # deploy key; drop the ssh-key line when the repos flip public at launch.
  drift-guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: xchain-indexer

      - name: Check out the canonical coin registry (xchain-hub)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-hub
          ssh-key: ${{ secrets.XCHAIN_HUB_DEPLOY_KEY }}
          path: xchain-hub

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Coin-registry byte-identity vs canonical
        run: xchain-hub/bin/sync-coins.sh --check --only xchain-indexer

      - name: Coin consensus-pin conformance (own vendored bundle)
        working-directory: xchain-indexer
        run: |
          node -e '
            const coins = require("./src/coins");
            for (const net of ["testnet", "regtest"]) {
              const res = coins.verifyConsensusPin(net);
              if (res && res.skipped) throw new Error("consensus pin unexpectedly unarmed for " + net);
            }
            console.log("consensus pin conformance OK (testnet, regtest)");
          '

      # Pre-flight drift gate (confirm/decode/pre-flight spec §8.5). The SDK's
      # Tier-2 client checks mirror validity logic that is authoritative in
      # src/actions/*.js here, and a handler change that lands without a paired
      # review of the mirror silently turns the client tier into a wrong answer
      # the user is shown BEFORE signing. The gate lives in the SDK (with the map
      # it reads) but has to run where both repos exist, which is this job.
      #
      # It was specced with slice 1 and never wired up, and the first run after
      # wiring found two handlers six days out of date - a live demonstration
      # that a gate nobody runs is not a gate.
      - name: Check out the pre-flight client checks (xchain-sdk)
        uses: actions/checkout@v4
        with:
          repository: XChain-Platform/xchain-sdk
          ssh-key: ${{ secrets.XCHAIN_SDK_DEPLOY_KEY }}
          path: xchain-sdk

      - name: Pre-flight <-> handler drift gate
        env:
          XCHAIN_INDEXER_PATH: ${{ github.workspace }}/xchain-indexer
        run: node xchain-sdk/bin/check-preflight-drift.js

  # Coverage ratchet : re-run the unit suite under c8 and fail if line or
  # branch coverage drops below this repo's floor in bin/coverage-thresholds.json
  # (mirrored into the `coverage:check` npm script). Catches silent coverage
  # regression the pass/fail gate cannot see: a change that keeps every test green
  # while deleting the only test that reached a file. These are RATCHET FLOORS
  # (~1-1.5 points below measured), not tier targets; raise them as coverage climbs.
  coverage:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Coverage thresholds (c8 --check-coverage)
        run: npm run coverage:check
